name: Docker (Build/Push)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    name: Build image
    # runs-on: [self-hosted, ssc-dto]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pyproject.toml
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "${TAG_VERSION}" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag version (${TAG_VERSION}) does not match pyproject.toml version (${{ steps.version.outputs.version }})."
            exit 1
          fi

      # - name: Install GoC CA cert
      #   run: |
      #     set -euo pipefail
      #     sudo mkdir -p /etc/docker/certs.d/ghcr.io
      #     awk '1' certs/GOC-GDC-ROOT-A.crt certs/GOC-GDC-ISSUING-A1A.crt | sudo tee /etc/docker/certs.d/ghcr.io/ca.crt > /dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        # with:
        #   buildkitd-config-inline: |
        #     [registry."ghcr.io"]
        #       ca=["/etc/docker/certs.d/ghcr.io/ca.crt"]

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ env.PLATFORMS }}
          # No build-args required for this project's Dockerfile.
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository }}:sha-${{ github.sha }}